[project]
name = "pyqueue"
version = "0.1.0"
description = "Task Queue & Job Processing System MVP"
requires-python = ">=3.9"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "saq",
    "redis",
    "sqlalchemy",
    "alembic",
    "pydantic",
    "pydantic-settings",
    "psycopg2-binary",
]

[project.optional-dependencies]
test = [
    "pytest",
    "httpx",
]

[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

